# Publishes @ai-ecoverse/wasm-tailscale with npm trusted publishing (OIDC) and
# provenance, exactly the certified tarball: the `package` artifact of a
# `build` run, whose sha256 must be `certified`. Two jobs:
# - verify (no id-token): fetches that artifact, rebuilds from this commit,
#   runs the offline tests and refuses unless the fresh tarball holds the same
#   files; it hands the checked tarball on as an artifact of this run.
# - publish (id-token): checks the handed-on tarball against `certified` again
#   and publishes it. It downloads nothing from third parties and runs no build.
# npm trusts this workflow file by name, so it is not reusable.
name: publish

on:
  workflow_dispatch:
    inputs:
      run:
        description: id of the `build` run whose `package` artifact was certified
        required: true
        type: string
      certified:
        description: sha256 of that certified tarball (ai-ecoverse-wasm-tailscale-<version>.tgz)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Fetch the certified tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          set -euo pipefail
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name package --dir "$RUNNER_TEMP/certified"
          mkdir -p "$RUNNER_TEMP/verified"
          find "$RUNNER_TEMP/certified" -name '*.tgz' -exec mv {} "$RUNNER_TEMP/verified/certified.tgz" \;
      - run: ./build.sh
      - name: Offline tests
        timeout-minutes: 3
        run: |
          node test/smoke.mjs
          node test/empty-control-url.mjs
          node test/throwing-callbacks.mjs
          node test/storage-failure.mjs newipn
          node test/storage-failure.mjs start
          node test/login-bursts.mjs healthy
          node test/login-bursts.mjs failed-start
      - name: Pack a fresh build
        run: |
          cp README.md LICENSE package/
          mkdir -p "$RUNNER_TEMP/fresh"
          cd package && npm pack --pack-destination "$RUNNER_TEMP/fresh"
      - name: Compare with the certified tarball
        env:
          CERTIFIED: ${{ inputs.certified }}
        run: |
          set -euo pipefail
          set +e
          node scripts/assert-certified.mjs "$RUNNER_TEMP/verified/certified.tgz" --certified "$CERTIFIED" \
            --rebuilt "$(ls "$RUNNER_TEMP"/fresh/*.tgz)"
          gate=$?
          set -e
          if [ "$gate" -ne 0 ] && [ "$gate" -ne 10 ]; then exit "$gate"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: verified
          path: ${{ runner.temp }}/verified/certified.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v5
        with:
          name: verified
          path: ${{ runner.temp }}/verified
      - name: Publish the certified tarball
        env:
          NODE_AUTH_TOKEN: ""
          CERTIFIED: ${{ inputs.certified }}
        run: |
          set -euo pipefail
          set +e
          node scripts/assert-certified.mjs "$RUNNER_TEMP/verified/certified.tgz" --certified "$CERTIFIED"
          gate=$?
          set -e
          if [ "$gate" -eq 10 ]; then exit 0; fi
          if [ "$gate" -ne 0 ]; then exit "$gate"; fi
          npm publish "$RUNNER_TEMP/verified/certified.tgz" --access public --provenance --tag latest
