# Publishes @ai-ecoverse/wasm-tailscale with npm trusted publishing (OIDC) and
# provenance. npm trusts this workflow file by name, so it is not reusable.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: ./build.sh
      - run: node test/smoke.mjs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          version=$(node -p "require('./package/package.json').version")
          case "$version" in
            *-*) ;;
            *) echo "refuse plain version $version; publish X.Y.Z-N only" >&2; exit 2 ;;
          esac
          cp README.md LICENSE package/
          cd package
          npm publish --access public --provenance
